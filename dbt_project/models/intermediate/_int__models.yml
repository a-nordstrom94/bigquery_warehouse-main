version: 2

models:
  - name: int_orders__payments_aggregated
    description: |
      Order-level payment aggregations. Includes total value, count, 
      max installments, and pivoted values for each payment type.
      Standardized source for both customer history and order enrichment.
    config:
      materialized: ephemeral
    columns:
      - name: order_id
        description: Unique order identifier
        data_tests:
          - not_null
          - unique
      - name: total_payment_value
        description: Sum of all payment values for the order
        data_tests:
          - not_null
      - name: payment_count
        description: Number of payment transactions for the order
      - name: max_payment_installments
        description: Maximum number of installments used across payments
      - name: payment_methods_used
        description: Comma-separated list of payment types used
      - name: credit_card_value
        description: Total value paid via credit card
      - name: boleto_value
        description: Total value paid via boleto
      - name: voucher_value
        description: Total value paid via voucher
      - name: debit_card_value
        description: Total value paid via debit card
      - name: primary_payment_type
        description: Most frequently used payment type for this order

  - name: int_orders__items_aggregated
    description: |
      Order-level item aggregations including product count,
      total item value, and freight costs.
    config:
      materialized: ephemeral
    columns:
      - name: order_id
        description: Unique order identifier
        data_tests:
          - not_null
          - unique
      - name: total_items
        description: Total number of items in the order
      - name: unique_products
        description: Count of distinct products in the order
      - name: total_items_price
        description: Sum of